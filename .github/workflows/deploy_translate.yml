name: Deploy translation worker to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'translate/**'
      - 'locales/**'
      - src/services/locale.ts
      - .github/workflows/deploy_translate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: translate
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Ensure cache bucket and queue exist
        run: |
          bunx wrangler r2 bucket create mimesis-translations 2>&1 | grep -Eiq "created|already" || exit 1
          bunx wrangler queues create mimesis-translate 2>&1 | grep -Eiq "created|already|taken" || exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
