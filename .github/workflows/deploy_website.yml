name: Deploy website to Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - .github/workflows/deploy_website.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  ZONE_NAME: mimesis.fun

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      # Workers custom domains refuse hostnames that still have A/AAAA/CNAME records
      # (the site used to live on Vercel). Drop the Vercel ones so wrangler can attach the domains.
      - name: Remove legacy DNS records
        env:
          DNS_TOKENS: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }} ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Use the first token that can see the zone.
          for CF_DNS_TOKEN in $DNS_TOKENS; do
            ZONE_ID=$(curl -s -H "Authorization: Bearer $CF_DNS_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME" | jq -r '.result[0].id // empty')
            [ -n "$ZONE_ID" ] && break
          done
          if [ -z "$ZONE_ID" ]; then echo "::warning::No token can edit $ZONE_NAME DNS, skipping cleanup"; exit 0; fi
          api() { curl -sf -H "Authorization: Bearer $CF_DNS_TOKEN" -H "Content-Type: application/json" "$@"; }
          api "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?per_page=100" | jq -r '.result[] | "  \(.type) \(.name) -> \(.content)"'
          for host in "$ZONE_NAME" "www.$ZONE_NAME"; do
            api "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=$host&per_page=50" \
              | jq -r '.result[] | select(.type == "A" or .type == "AAAA" or .type == "CNAME") | select(.content == "76.76.21.21" or (.content | test("vercel"; "i"))) | "\(.id) \(.type) \(.name) \(.content)"' \
              | while read -r id type name content; do
                  echo "Deleting $type $name -> $content"
                  api -X DELETE "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$id" > /dev/null
                done
          done
      - name: Deploy static site as a Worker
        working-directory: website
        run: bunx wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
